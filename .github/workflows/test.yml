name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # src/paths.py 默认按 Path.home()/hermes-session-roles 定位仓库，CI 里 HOME 是
      # /home/runner 而非 workspace，不覆盖则 validate_roles 目录不存在直接退出 1。
      SESSION_ROLES_ROOT: ${{ github.workspace }}
      # tests/test_validate_roles_reverse.py 硬编码同一路径做 import。
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check syntax
        run: |
          find src/ -name '*.py' -exec python3 -m py_compile {} +
      - name: Run tests
        run: |
          python3 tests/test_registry.py
          python3 tests/test_validate_roles_reverse.py
      - name: Validate roles
        run: |
          python3 src/validate_roles.py
      - name: Validate JSONs
        run: |
          python3 -c "
          import json, os
          for root, _, files in os.walk('personas'):
            for f in sorted(files):
              if f.endswith('.json'):
                path = os.path.join(root, f)
                with open(path) as fh:
                  json.load(fh)
                print(f'  OK  {path}')
          print('All JSON valid')
          "
